name: ci

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional numeric Linux prerelease version; defaults to committed metadata"
        required: false
        type: string
      generate_linux_locks:
        description: "Generate and verify ContourPy Linux locks only; not a product/release validation"
        required: false
        type: boolean
        default: false
      browser_diagnostics:
        description: "Also run context/workflows browser diagnostics early; all product gates still run"
        required: false
        type: boolean
        default: false
      browser_diagnostics_only:
        description: "Diagnostic-only run: no product/release gate or publishable artifact"
        required: false
        type: boolean
        default: false
      security_lock_refresh:
        description: "Native certifi lock maintenance only; requires diagnostic-only mode"
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

jobs:
  security-lock-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.security_lock_refresh == true && inputs.browser_diagnostics_only == true
    uses: ./.github/workflows/security-lock-refresh.yml
    permissions:
      contents: read

  browser-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_diagnostics == true && inputs.generate_linux_locks != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [context, workflows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked bootstrap
        run: bash scripts/bootstrap.sh --python python3.12
      - name: Install Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Existing browser suite
        run: bash scripts/e2e.sh --suite ${{ matrix.suite }} --diagnostics-root .tmp/early-browser-${{ matrix.suite }}
      - name: Synthetic child-page diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-browser-${{ matrix.suite }}-${{ github.sha }}
          path: .tmp/early-browser-${{ matrix.suite }}
          if-no-files-found: ignore

  generate-linux-locks:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_linux_locks == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            target: py311-linux
            profile: runtime
          - python: "3.11"
            target: py311-linux
            profile: dev
          - python: "3.12"
            target: py312-linux
            profile: runtime
          - python: "3.12"
            target: py312-linux
            profile: dev
    env:
      LOCK_TARGET: ${{ matrix.target }}
      LOCK_PROFILE: ${{ matrix.profile }}
      LOCK_EVIDENCE: .tmp/native-contour-locks/${{ matrix.target }}-${{ matrix.profile }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download exact existing wheels and one native ContourPy wheel
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/native-contour-locks"
          mkdir "$STAGE"
          python -m venv "$STAGE/generator"
          GENERATOR="$STAGE/generator/bin/python"
          "$GENERATOR" -m pip install --only-binary=:all: 'packaging==25.0'
          mkdir "$STAGE/wheels"
          "$GENERATOR" -m pip download --only-binary=:all: --require-hashes \
            -r "backend/requirements-$LOCK_TARGET-$LOCK_PROFILE.lock" --dest "$STAGE/wheels"
          "$GENERATOR" -m pip download --only-binary=:all: --no-deps \
            'contourpy==1.3.2' --dest "$STAGE/wheels"
          echo "LOCK_STAGE=$STAGE" >> "$GITHUB_ENV"
          echo "GENERATOR_PYTHON=$GENERATOR" >> "$GITHUB_ENV"
      - name: Generate native hashes and reject all existing dependency drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOCK_EVIDENCE"
          INPUT="backend/requirements-$LOCK_TARGET-$LOCK_PROFILE.in"
          OUTPUT="$LOCK_EVIDENCE/requirements-$LOCK_TARGET-$LOCK_PROFILE.lock"
          cp "$INPUT" "${OUTPUT%.lock}.in"
          "$GENERATOR_PYTHON" scripts/generate_python_lock.py "$LOCK_STAGE/wheels" "$OUTPUT" \
            --target "$LOCK_TARGET" --profile "$LOCK_PROFILE"
          "$GENERATOR_PYTHON" scripts/validate_python_lock.py "$OUTPUT" \
            --target "$LOCK_TARGET" --profile "$LOCK_PROFILE"
          "$GENERATOR_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import sys
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from scripts.generate_python_lock import collect_wheel_records
          from scripts.validate_python_lock import validate_lock_text

          target, profile = os.environ["LOCK_TARGET"], os.environ["LOCK_PROFILE"]
          evidence = Path(os.environ["LOCK_EVIDENCE"])
          filename = f"requirements-{target}-{profile}"
          baseline = Path("backend") / f"{filename}.lock"
          generated = evidence / baseline.name
          inputs = evidence / f"{filename}.in"
          if "contourpy==1.3.2" not in inputs.read_text().splitlines():
              raise SystemExit("The committed input must declare contourpy==1.3.2")
          before = validate_lock_text(baseline.read_text(), {}, target=target, profile=profile)
          after = validate_lock_text(generated.read_text(), {}, target=target, profile=profile)
          if set(after) != set(before) | {"contourpy"}:
              raise SystemExit("Only ContourPy may be added to the existing lock")
          for name, record in before.items():
              if after[name] != record:
                  raise SystemExit(f"Existing version or wheel SHA-256 changed: {name}")
          if after["contourpy"]["version"] != "1.3.2":
              raise SystemExit("Unexpected ContourPy version")
          wheelhouse = Path(os.environ["LOCK_STAGE"]) / "wheels"
          records = {item["name"]: item for item in collect_wheel_records(wheelhouse)}
          wheels = []
          for path in sorted(wheelhouse.glob("*.whl")):
              name, version, _, tags = parse_wheel_filename(path.name)
              wheels.append({
                  "filename": path.name, "name": name, "version": str(version),
                  "sha256": records[name]["sha256"],
                  "tags": sorted(str(tag) for tag in tags),
              })
          receipt = {
              "schema_version": 1,
              "purpose": "native_contourpy_lock_generation_only",
              "product_validation_complete": False,
              "status": "generated_pending_offline_install",
              "source_commit": os.environ["GITHUB_SHA"],
              "target": target, "profile": profile,
              "python": sys.version,
              "python_implementation": platform.python_implementation(),
              "system": platform.system(), "machine": platform.machine(),
              "os_release": Path("/etc/os-release").read_text(),
              "baseline_lock_sha256": hashlib.sha256(baseline.read_bytes()).hexdigest(),
              "input_sha256": hashlib.sha256(inputs.read_bytes()).hexdigest(),
              "generated_lock_sha256": hashlib.sha256(generated.read_bytes()).hexdigest(),
              "existing_versions_and_hashes_unchanged": True,
              "added_packages": sorted(set(after) - set(before)),
              "wheel_records": wheels,
              "network_isolation_enforced": False,
              "offline_install_policy": "no-index, local wheelhouse, require-hashes, wheel-only",
          }
          (evidence / "native-lock-evidence.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Install generated lock offline and verify serial contour calculation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$LOCK_STAGE/validation"
          VALIDATOR="$LOCK_STAGE/validation/bin/python"
          "$VALIDATOR" -m pip install --no-index --find-links "$LOCK_STAGE/wheels" \
            --only-binary=:all: --require-hashes \
            -r "$LOCK_EVIDENCE/requirements-$LOCK_TARGET-$LOCK_PROFILE.lock"
          "$VALIDATOR" -m pip check | tee "$LOCK_EVIDENCE/pip-check.txt"
          "$VALIDATOR" -m pip list --format=json > "$LOCK_EVIDENCE/installed-packages.json"
          "$VALIDATOR" - <<'PY'
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path
          import contourpy
          import numpy as np

          assert contourpy.__version__ == "1.3.2"
          for name, expected in (
              ("numpy", "2.2.6"), ("scipy", "1.15.3"), ("scikit-learn", "1.7.2")
          ):
              assert importlib.metadata.version(name) == expected, name
          coordinates = np.array([0.0, 1.0, 2.0])
          generator = contourpy.contour_generator(
              x=coordinates, y=coordinates, z=np.tile(coordinates, (3, 1)), name="serial"
          )
          assert type(generator).__name__ == "SerialContourGenerator"
          values = {}
          for level in (0.5, 1.5):
              lines = generator.lines(level)
              assert len(lines) == 1 and lines[0].shape[1] == 2
              assert np.isfinite(lines[0]).all()
              np.testing.assert_array_equal(lines[0][:, 0], level)
              assert float(lines[0][:, 1].min()) == 0.0
              assert float(lines[0][:, 1].max()) == 2.0
              values[str(level)] = lines[0].tolist()
          evidence = Path(os.environ["LOCK_EVIDENCE"]) / "native-lock-evidence.json"
          receipt = json.loads(evidence.read_text(encoding="utf-8"))
          receipt.update({
              "status": "passed",
              "offline_install_passed": True,
              "pip_check_passed": True,
              "validation_python": platform.python_version(),
              "serial_smoke": {
                  "algorithm": type(generator).__name__,
                  "contourpy": contourpy.__version__,
                  "numpy": np.__version__,
                  "lines": values,
              },
          })
          evidence.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-contourpy-locks-${{ matrix.target }}-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ env.LOCK_EVIDENCE }}
          if-no-files-found: error

  security-python:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
            target: py310-win
            profile: dev
            lock: backend/requirements-py310-win.lock
          - os: ubuntu-24.04
            python: "3.11"
            target: py311-linux
            profile: runtime
            lock: backend/requirements-py311-linux-runtime.lock
          - os: ubuntu-24.04
            python: "3.11"
            target: py311-linux
            profile: dev
            lock: backend/requirements-py311-linux-dev.lock
          - os: ubuntu-24.04
            python: "3.12"
            target: py312-linux
            profile: runtime
            lock: backend/requirements-py312-linux-runtime.lock
          - os: ubuntu-24.04
            python: "3.12"
            target: py312-linux
            profile: dev
            lock: backend/requirements-py312-linux-dev.lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated audit tool and exact target lock
        shell: pwsh
        run: |
          python -m venv .security-target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .security-tool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' }
          $target = Join-Path '.security-target' $suffix
          $auditor = Join-Path '.security-tool' $suffix
          & $target -m pip install --require-hashes --only-binary=:all: -r '${{ matrix.lock }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $auditor -m pip install --only-binary=:all: 'pip-audit==2.10.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dependency_security.py --target-python $target --audit-python $auditor --lock '${{ matrix.lock }}' --profile '${{ matrix.profile }}' --output-dir .tmp/security
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-${{ matrix.target }}-${{ matrix.profile }}
          path: .tmp/security
          if-no-files-found: error

  security-npm:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix frontend ci
      - name: Runtime and development dependency audit
        run: python scripts/dependency_security.py --frontend frontend --output-dir .tmp/security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-npm
          path: .tmp/security
          if-no-files-found: error

  dependency-security:
    if: always() && inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    needs: [security-python, security-npm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require all dependency audits
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/release_readiness.py gate --kind dependencies --source-commit "$GITHUB_SHA" --output .tmp/dependency-gate.json

  windows:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    runs-on: windows-latest
    # Run39467075706 was still advancing at 87% when the 60-minute job expired.
    # Preserve every check; allow the native spawn-heavy suite plus frontend work.
    timeout-minutes: 90
    env:
      DATALAB_GP_REFERENCE_MODE: independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1
      - name: Check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check.ps1

  windows-e2e:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    runs-on: windows-latest
    needs: windows
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [workflows, context, data, prediction]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: playwright-chromium-windows-${{ hashFiles('backend/pyproject.toml') }}
      - name: Bootstrap
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1
      - name: Install Playwright Chromium
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: .\.venv\Scripts\python.exe -m playwright install chromium
      - name: Browser E2E Smoke
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
          DATALAB_E2E_ROOT: ${{ runner.temp }}\datalab-e2e
          DATALAB_E2E_DIAGNOSTICS_ROOT: ${{ runner.temp }}\datalab-e2e-diagnostics
        run: powershell -ExecutionPolicy Bypass -File .\scripts\e2e.ps1 -Suite "${{ matrix.suite }}" -WorkspaceRoot "${{ env.DATALAB_E2E_ROOT }}" -DiagnosticsRoot "${{ env.DATALAB_E2E_DIAGNOSTICS_ROOT }}" -KeepWorkspace
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\logs\*.log
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\screenshots\*.png
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\html\*.html
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\*.json
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\*.zip
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\*.png
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\*.html
            ${{ runner.temp }}\datalab-e2e-diagnostics\refined-ui\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\startup\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\dataset-context\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\gp-prediction-context\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\schema-concurrency\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\analysis-completion\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\report-center-context\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\managed-reports\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\api-boundary\**
            ${{ runner.temp }}\datalab-e2e-diagnostics\chart-formatting\**
          if-no-files-found: ignore

  e2e:
    if: always() && inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    needs: windows-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every isolated Windows browser suite
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/release_readiness.py gate --kind windows-e2e --source-commit "$GITHUB_SHA" --output .tmp/windows-e2e-gate.json

  linux:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu24-py312-${{ hashFiles('backend/requirements-py312-linux-dev.lock') }}
      - name: Linux bootstrap
        run: bash scripts/bootstrap.sh --python python3.12
      - name: Independent Linux numerical probe
        run: .venv/bin/python scripts/probe_linux_numerics.py --output-dir .tmp/numerics-py312
      - name: Numerical probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-probe-py312
          path: .tmp/numerics-py312
          if-no-files-found: ignore
      - name: Linux full check
        run: bash scripts/check.sh
      - name: Linux source runner lifecycle
        run: .venv/bin/python tests/e2e/linux_source.py --diagnostics-root .tmp/linux-e2e/source-runner
      - name: Install Linux Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Linux browser E2E
        run: bash scripts/e2e.sh --diagnostics-root .tmp/linux-e2e
      - name: Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-diagnostics
          path: .tmp/linux-e2e
          if-no-files-found: ignore

  python311:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu24-py311-${{ hashFiles('backend/requirements-py311-linux-dev.lock') }}
      - name: Install Python 3.11 locked environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-py311-linux-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e './backend[dev]'
          .venv/bin/python -m pip check
      - name: Python 3.11 calculation and API compatibility
        run: .venv/bin/python -m pytest backend/tests
      - name: Independent Python 3.11 numerical probe
        if: always()
        run: .venv/bin/python scripts/probe_linux_numerics.py --output-dir .tmp/numerics-py311
      - name: Numerical probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-probe-py311
          path: .tmp/numerics-py311
          if-no-files-found: ignore

  gp-resources:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
            target: py310-win
          - os: ubuntu-24.04
            python: "3.12"
            target: py312-linux
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact native dev lock and application
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = if ($IsWindows) { '.venv/Scripts/python.exe' } else { '.venv/bin/python' }
          $lock = if ($IsWindows) { 'backend/requirements-py310-win.lock' } else { 'backend/requirements-py312-linux-dev.lock' }
          & $python -m pip install --only-binary=:all: --require-hashes -r $lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps --no-build-isolation -e './backend[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          exit $LASTEXITCODE
      - name: Measure synthetic fit CV restoration and prediction
        shell: pwsh
        run: |
          $python = if ($IsWindows) { '.venv/Scripts/python.exe' } else { '.venv/bin/python' }
          & $python scripts/benchmark_gp_resources.py --rows 501 1000 2000 --output .tmp/gp-resources/results.json
          exit $LASTEXITCODE
      - name: Preserve synthetic measurement and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-resources-${{ matrix.target }}-${{ github.sha }}
          path: .tmp/gp-resources
          if-no-files-found: error

  linux-release:
    if: inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    runs-on: ubuntu-24.04
    needs: [linux, python311]
    timeout-minutes: 35
    env:
      RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap builder
        run: bash scripts/bootstrap.sh --python python3.12
      - name: Resolve committed or explicit release version
        run: .venv/bin/python scripts/release_readiness.py version --override "$RELEASE_VERSION_OVERRIDE" --github-env "$GITHUB_ENV"
      - name: Install validation browser
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Build exact committed archive
        run: .venv/bin/python scripts/build_linux_release.py --source-commit "$GITHUB_SHA" --release-version "$RELEASE_VERSION" --output-dir .tmp/linux-release
      - name: Verify completed archive offline
        run: .venv/bin/python scripts/verify_linux_release.py ".tmp/linux-release/statistical-twin-linux-$RELEASE_VERSION-ubuntu24.04-x86_64-py312.tar.gz" --output-dir .tmp/linux-release-validation --expected-source-commit "$GITHUB_SHA" --expected-release-version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-linux-release-${{ github.sha }}
          path: |
            .tmp/linux-release/*
            .tmp/linux-release-validation/validation-report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-release-failure-diagnostics
          path: .tmp/linux-release-validation
          if-no-files-found: ignore

  release-ready:
    if: always() && inputs.generate_linux_locks != true && inputs.browser_diagnostics_only != true
    needs: [windows, e2e, linux, python311, linux-release, dependency-security, gp-resources]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require all product, security and archive gates
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/release_readiness.py gate --kind release --source-commit "$GITHUB_SHA" --output .tmp/release-ready.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-ready-${{ github.sha }}
          path: .tmp/release-ready.json
          if-no-files-found: error
