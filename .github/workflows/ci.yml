name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DATALAB_GP_REFERENCE_MODE: independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1
      - name: Check
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check.ps1

  e2e:
    runs-on: windows-latest
    needs: windows
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: playwright-chromium-windows-${{ hashFiles('backend/pyproject.toml') }}
      - name: Bootstrap
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1
      - name: Install Playwright Chromium
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
        run: .\.venv\Scripts\python.exe -m playwright install chromium
      - name: Browser E2E Smoke
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
          DATALAB_E2E_ROOT: ${{ runner.temp }}\datalab-e2e
          DATALAB_E2E_DIAGNOSTICS_ROOT: ${{ runner.temp }}\datalab-e2e-diagnostics
        run: powershell -ExecutionPolicy Bypass -File .\scripts\e2e.ps1 -WorkspaceRoot "${{ env.DATALAB_E2E_ROOT }}" -DiagnosticsRoot "${{ env.DATALAB_E2E_DIAGNOSTICS_ROOT }}" -KeepWorkspace
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\logs\*.log
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\screenshots\*.png
            ${{ runner.temp }}\datalab-e2e-diagnostics\**\html\*.html
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu24-py312-${{ hashFiles('backend/requirements-py312-linux-dev.lock') }}
      - name: Linux bootstrap
        run: bash scripts/bootstrap.sh --python python3.12
      - name: Independent Linux numerical probe
        run: .venv/bin/python scripts/probe_linux_numerics.py --output-dir .tmp/numerics-py312
      - name: Numerical probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-probe-py312
          path: .tmp/numerics-py312
          if-no-files-found: ignore
      - name: Linux full check
        run: bash scripts/check.sh
      - name: Linux source runner lifecycle
        run: .venv/bin/python tests/e2e/linux_source.py --diagnostics-root .tmp/linux-e2e/source-runner
      - name: Install Linux Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Linux browser E2E
        run: bash scripts/e2e.sh --diagnostics-root .tmp/linux-e2e
      - name: Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-diagnostics
          path: .tmp/linux-e2e
          if-no-files-found: ignore

  python311:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ubuntu24-py311-${{ hashFiles('backend/requirements-py311-linux-dev.lock') }}
      - name: Install Python 3.11 locked environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-py311-linux-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e './backend[dev]'
          .venv/bin/python -m pip check
      - name: Python 3.11 calculation and API compatibility
        run: .venv/bin/python -m pytest backend/tests
      - name: Independent Python 3.11 numerical probe
        if: always()
        run: .venv/bin/python scripts/probe_linux_numerics.py --output-dir .tmp/numerics-py311
      - name: Numerical probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-probe-py311
          path: .tmp/numerics-py311
          if-no-files-found: ignore

  linux-release:
    runs-on: ubuntu-24.04
    needs: [linux, python311]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bootstrap builder
        run: bash scripts/bootstrap.sh --python python3.12
      - name: Install validation browser
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Build exact committed archive
        run: .venv/bin/python scripts/build_linux_release.py --source-commit "$GITHUB_SHA" --release-version 2026.10.1 --output-dir .tmp/linux-release
      - name: Verify completed archive offline
        run: .venv/bin/python scripts/verify_linux_release.py .tmp/linux-release/statistical-twin-linux-2026.10.1-ubuntu24.04-x86_64-py312.tar.gz --output-dir .tmp/linux-release-validation
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-linux-release-${{ github.sha }}
          path: |
            .tmp/linux-release/*
            .tmp/linux-release-validation/validation-report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-release-failure-diagnostics
          path: .tmp/linux-release-validation
          if-no-files-found: ignore
