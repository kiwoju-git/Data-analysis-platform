name: native-security-lock-generation
on:
  push:
    branches: [build/remediation-security-locks]
permissions:
  contents: read
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
            target: py311-linux
          - os: ubuntu-24.04
            python: '3.12'
            target: py312-linux
          - os: windows-latest
            python: '3.10'
            target: py310-win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install packaging==25.0
      - run: python scripts/refresh_security_locks.py --target ${{ matrix.target }} --output-dir .tmp/generated-locks
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-locks-${{ matrix.target }}
          path: .tmp/generated-locks
